<script>
let nota1 = 7;
let nota2 = 5;
let nota3 = 6;

let media = (nota1 + nota2 + nota3) / 3;

let situacao = media >= 6 ? "Aprovado" 
            : media >= 4 ? "Recuperação" 
            : "Reprovado";

console.log("Nota 1: " + nota1);
console.log("Nota 2: " + nota2);
console.log("Nota 3: " + nota3);
console.log("Média: " + media);
console.log("Situação: " + situacao);
</script>
